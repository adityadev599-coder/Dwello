<!DOCTYPE html>

    <title>Dwello - Your Urban Living Assistant</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
        }

        .primary-btn {
            transition: all 0.3s ease;
        }

        .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
        }

        .card-hover {
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow:
                0 20px 25px -5px rgb(0 0 0 / 0.1),
                0 8px 10px -6px rgb(0 0 0 / 0.1);
            border-color: #4f46e5;
        }

        .search-wrapper {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }

        .search-tab.active {
            background-color: #4f46e5;
            color: white;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spotlight-section.is-visible .phone-mockup {
            opacity: 1;
            transform: translateY(0);
            transition:
                transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1),
                opacity 0.8s ease;
        }

        .spotlight-section.is-visible .spotlight-content {
            opacity: 1;
            transform: translateY(0);
            transition:
                transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) 0.2s,
                opacity 0.8s ease 0.2s;
        }

        .spotlight-section.is-visible .mockup-item {
            animation: slideInUp 0.6s ease-out forwards;
        }

        .mockup-item:nth-child(1) {
            animation-delay: 0.5s;
        }

        .mockup-item:nth-child(2) {
            animation-delay: 0.7s;
        }

        .mockup-item:nth-child(3) {
            animation-delay: 0.9s;
        }

        .mockup-item:nth-child(4) {
            animation-delay: 1.1s;
        }
    </style>
</head>
